type Concept {
  name: String! @id @search(by: [hash])
  arguments: [ConceptArgumentType!]! @hasInverse(field: ownerConcept)
  composition: ConceptComposition @hasInverse(field: ownerConcept)
  wh: String! # "w:h"
}

type ConceptArgumentType {
  name: String! @id @search(by: [hash])
  positionAngle: Int!
  ownerConcept: Concept!
  capacity: String!
}

type ConceptComposition {
  id: ID!
  ownerConcept: Concept!
  subConcepts: [SubConcept!]! @hasInverse(field: ownerConceptComposition)
  connections: [SubConceptConnection!]! @hasInverse(field: ownerConceptComposition)
}

type SubConcept {
  id: ID!
  ownerConceptComposition: ConceptComposition!
  concept: Concept!
  xy: String # "x:y", ought to be unique among all sub-concepts of this owner concept => can work as a sort of ID
}

type SubConceptConnection {
  id: ID!
  ownerConceptComposition: ConceptComposition!
  fedSubConceptKey: String! # can be a SubConcept's xy or an Argument's name
  fedSubConceptArgumentType: ConceptArgumentType!
  argumentFeederType: ArgumentFeederType!
  argumentFeederKey: String # For OtherSubConcept + OtherSubConceptArgument
  argumentFeederArgumentType: ConceptArgumentType # For OtherSubConceptArgument + OwnerArgument
}

enum ArgumentFeederType {
  Self # the sub-concept is its own argument
  OtherSubConcept
  OtherSubConceptArgument
  OwnerArgument
}
